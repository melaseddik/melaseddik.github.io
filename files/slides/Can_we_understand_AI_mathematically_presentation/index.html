<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Can we understand AI mathematically?</title>
<style>
/* VOICE: a quiet stage; the animations are the talk, the chrome disappears
   IDEA: a beamer deck where every \pause is a short Manim clip
   PICTURE: the full-bleed 16:9 clip, nothing drawn over it while presenting
   COLOUR and TYPE: white stage, ink #1c1c28, the deck's purple #6a3fb5 for the HUD; system sans
   LAYOUT: clip centred and letterboxed; HUD fades in only when the mouse moves */
:root{color-scheme:light;--ink:#1c1c28;--accent:#6a3fb5;--muted:#6b6b7e}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);overflow:hidden;
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#fff;cursor:none}
#stage.cursor{cursor:default}
.frame{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9}
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;opacity:0}
.frame video.on{opacity:1;z-index:2}
.frame video.fade{transition:opacity .28s ease}
#hud{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;
  padding:10px max(14px,2vw);background:linear-gradient(transparent,rgba(255,255,255,.96) 40%);
  opacity:0;transition:opacity .3s;z-index:5}
#hud.show{opacity:1}
#hud button{font:inherit;color:var(--ink);background:#fff;border:1px solid #d6d6e0;border-radius:8px;
  min-width:44px;height:40px;padding:0 12px;cursor:pointer}
#hud button:hover{border-color:var(--accent);color:var(--accent)}
#hud button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#pos{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
#scene{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--accent);font-weight:600}
#bar{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);width:0;z-index:6;transition:width .2s}
#ov{position:fixed;inset:0;background:rgba(255,255,255,.97);z-index:10;display:none;overflow:auto;padding:28px max(16px,4vw)}
#ov.show{display:block}
#ov h2{margin:0 0 6px;font-size:24px}
#ov p{margin:0 0 18px;color:var(--muted)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
#grid button{text-align:left;font:inherit;color:var(--ink);background:#fff;border:1px solid #e0e0ea;border-radius:8px;
  padding:10px 12px;min-height:44px;cursor:pointer}
#grid button b{color:var(--accent);font-variant-numeric:tabular-nums;margin-right:6px}
#grid button.cur{border-color:var(--accent);background:#f4f0fb}
#grid button:hover{border-color:var(--accent)}
#help{position:fixed;top:14px;right:16px;z-index:5;color:var(--muted);font-size:13px;opacity:0;transition:opacity .3s}
#help.show{opacity:1}
@media (prefers-reduced-motion:reduce){.frame video.fade,#hud,#bar{transition:none}}
</style>
</head>
<body>
<div id="stage"><div class="frame"><video id="v0" muted playsinline preload="auto"></video><video id="v1" muted playsinline preload="auto"></video></div></div>
<div id="help">→ / Space / click: next · ←: back · F: fullscreen · O: overview</div>
<div id="hud">
  <button id="prev" aria-label="Previous step">←</button>
  <button id="next" aria-label="Next step">→</button>
  <span id="pos"></span><span id="scene"></span>
  <button id="ovb">Overview</button>
  <button id="fs">Fullscreen</button>
</div>
<div id="bar"></div>
<div id="ov" role="dialog" aria-label="Overview"><h2>Overview</h2><p>Jump to a slide. Esc to close.</p><div id="grid"></div></div>
<script src="segments.js"></script>
<script>
{
const S = window.SEGMENTS;            // [{src, scene, title}]
const vids = [document.getElementById('v0'), document.getElementById('v1')];
const stage = document.getElementById('stage'), hud = document.getElementById('hud'), help = document.getElementById('help');
const pos = document.getElementById('pos'), sceneEl = document.getElementById('scene'), bar = document.getElementById('bar');
const ov = document.getElementById('ov'), grid = document.getElementById('grid');
let cur = -1, front = 0, busy = false;

function load(v, i) {
  if (i < 0 || i >= S.length) return;
  if (v.dataset.i !== String(i)) { v.dataset.i = String(i); v.src = S[i].src; v.load(); }
}
function ui() {
  pos.textContent = (cur + 1) + ' / ' + S.length;
  sceneEl.textContent = S[cur].title;
  bar.style.width = ((cur + 1) / S.length * 100) + '%';
  for (const b of grid.children) b.classList.toggle('cur', +b.dataset.first <= cur && cur <= +b.dataset.last);
}
function show(i, mode) {           // mode: 'play' plays the step; 'end' shows its final frame
  if (i < 0 || i >= S.length || busy) return;
  busy = true;
  const newScene = cur < 0 || S[i].scene !== S[cur].scene;
  const back = vids[1 - front], fr = vids[front];
  load(back, i);
  const go = () => {
    back.classList.toggle('fade', newScene);
    if (mode === 'end') { back.pause(); try { back.currentTime = Math.max(0, back.duration - 0.04); } catch (e) {} }
    else { back.currentTime = 0; const p = back.play(); if (p) p.catch(() => {}); }
    back.classList.add('on'); fr.classList.remove('on'); fr.pause();
    front = 1 - front; cur = i; busy = false; ui();
    load(vids[1 - front], i + 1);   // preload the next step
  };
  if (back.readyState >= 2) go(); else back.addEventListener('loadeddata', go, { once: true });
}
function next() {
  const v = vids[front];
  if (cur >= 0 && !v.paused && !v.ended && v.currentTime < v.duration - 0.05) {   // finish the running step
    v.pause(); v.currentTime = Math.max(0, v.duration - 0.04); return;
  }
  if (cur < S.length - 1) show(cur + 1, 'play');
}
function prev() { if (cur > 0) show(cur - 1, 'end'); }
function fullscreen() {
  try { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); } catch (e) {}
}
function toggleOv(on) { ov.classList.toggle('show', on); }

// overview: one button per scene
const scenes = [];
S.forEach((s, i) => { const l = scenes[scenes.length - 1]; if (l && l.scene === s.scene) l.last = i; else scenes.push({ scene: s.scene, title: s.title, first: i, last: i }); });
scenes.forEach((sc, k) => {
  const b = document.createElement('button');
  b.dataset.first = sc.first; b.dataset.last = sc.last;
  const n = document.createElement('b'); n.textContent = String(k + 1);
  b.append(n, document.createTextNode(sc.title));
  b.addEventListener('click', () => { toggleOv(false); show(sc.first, 'play'); });
  grid.append(b);
});

document.addEventListener('keydown', e => {
  if (ov.classList.contains('show')) { if (e.key === 'Escape' || e.key === 'o' || e.key === 'O') toggleOv(false); return; }
  const k = e.key;
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter', 'n'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace', 'p'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'Home') show(0, 'end');
  else if (k === 'End') show(S.length - 1, 'end');
  else if (k === 'f' || k === 'F') fullscreen();
  else if (k === 'o' || k === 'O') toggleOv(true);
});
stage.addEventListener('click', next);
document.getElementById('next').addEventListener('click', next);
document.getElementById('prev').addEventListener('click', prev);
document.getElementById('fs').addEventListener('click', fullscreen);
document.getElementById('ovb').addEventListener('click', () => toggleOv(true));
let t;
document.addEventListener('mousemove', () => {
  hud.classList.add('show'); help.classList.add('show'); stage.classList.add('cursor');
  clearTimeout(t); t = setTimeout(() => { hud.classList.remove('show'); help.classList.remove('show'); stage.classList.remove('cursor'); }, 2200);
});
show(0, 'play');
}
</script>
</body>
</html>
